volumes:
  images:
  redis_data:

services:
  frontend:
    build:
      context: ./frontend
    networks:
      - revex

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config/keys:/app/config/keys:ro
      - ./config/lti_config.json:/app/config/lti_config.json:ro
      - images:/app/images
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - revex

  nginx:
    build:
      context: ./nginx
    ports:
      - "3162:80"
    volumes:
      - images:/usr/share/nginx/static/images
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - revex

  redis:
    image: redis:8.0.3-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 96M
    cpus: 0.2
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - revex

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run rq worker --url ${REDIS_URL:-redis://redis:6379/0} pregrading
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config/keys:/app/config/keys:ro
      - ./config/lti_config.json:/app/config/lti_config.json:ro
      - images:/app/images
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - revex

networks:
    revex:
      driver: bridge
